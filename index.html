<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <title>Property registration timeline</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
        <style>
            *, *::before, *::after {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            html, body {
                width: 100%;
                background: #dddad5;
                overflow-x: hidden;
            }

            body {
                font-family: 'Proxima Nova', 'Proxima', 'Poppins', 'Arial Narrow', Arial, sans-serif;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
            }

            .graphic-headline {
                padding-top: clamp(10px, 1.5vh, 18px);
                text-align: center;
                margin-bottom: clamp(10px, 2vh, 24px);
                width: min(100vw, 100vh, 1080px);
                max-width: 1080px;
                padding: 0 4%;
            }

            .graphic-headline h1 {
                font-size: clamp(22px, 4.5vmin, 52px);
                font-weight: 900;
                color: #1c1c1c;
                letter-spacing: .02em;
                line-height: 1.15;
                margin-bottom: clamp(4px, .8vmin, 10px);
            }

            .graphic-headline p {
                font-size: clamp(10px, 1.8vmin, 20px);
                font-weight: 500;
                color: rgba(0,0,0,.4);
                letter-spacing: .05em;
            }

            /* ── FRAME ─────────────────────────────────── */
            .frame {
                width: min(100vw, 1080px);
                height: min(100vw * 1.25, 1350px);
                max-width: 1080px;
                max-height: 1350px;
                position: relative;
                overflow: hidden;
                background: #f8f6f2;
                background-image: linear-gradient(rgba(221,31,38,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(221,31,38,.04) 1px, transparent 1px);
                background-size: 40px 40px;
            }

            /* ── TOP ACCENT BAR ────────────────────────── */
            .top-bar {
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                height: 4px;
                background: linear-gradient(90deg, #dd1f26, #ff4d53, #dd1f26);
                z-index: 20;
            }

            /* ── COUNTER ───────────────────────────────── */
            .slide-counter {
                position: absolute;
                top: 4%;
                right: 5%;
                display: flex;
                flex-direction: column;
                align-items: flex-end;
                gap: clamp(3px, .6vmin, 6px);
                z-index: 5;
            }

            .counter-num {
                display: flex;
                align-items: baseline;
                gap: .15em;
                font-weight: 800;
                letter-spacing: .02em;
            }

            .counter-current {
                font-size: clamp(24px, 5.5vmin, 58px);
                color: #dd1f26;
                line-height: .9;
            }

            .counter-sep {
                font-size: clamp(10px, 2vmin, 22px);
                color: rgba(0,0,0,.2);
                font-weight: 400;
            }

            .counter-total {
                font-size: clamp(10px, 2vmin, 22px);
                color: rgba(0,0,0,.25);
            }

            .counter-bar {
                width: clamp(40px, 8vmin, 86px);
                height: clamp(2px, .35vmin, 3px);
                background: rgba(0,0,0,.1);
                border-radius: 100px;
                overflow: hidden;
            }

            .counter-bar-fill {
                height: 100%;
                background: #dd1f26;
                border-radius: 100px;
                transition: width .4s cubic-bezier(.77,0,.175,1);
            }

            /* ── SLIDES ────────────────────────────────── */
            .slides-container {
                width: 100%;
                height: 100%;
                position: relative;
            }

            .slide {
                position: absolute;
                inset: 0;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                padding: 7% 5% 14% 5%;
                text-align: center;
                transition: transform .48s cubic-bezier(.77,0,.175,1), opacity .48s ease;
                will-change: transform, opacity;
            }

            .slide[data-state="active"] {
                transform: translateX(0);
                opacity: 1;
                pointer-events: auto;
            }

            .slide[data-state="before"] {
                transform: translateX(-100%);
                opacity: 0;
                pointer-events: none;
            }

            .slide[data-state="after"] {
                transform: translateX(100%);
                opacity: 0;
                pointer-events: none;
            }

            /* ── REGISTERED LABEL ──────────────────────── */
            .reg-label {
                font-size: clamp(10px, 2.2vmin, 22px);
                font-weight: 700;
                letter-spacing: .2em;
                color: rgba(0,0,0,.35);
                text-transform: uppercase;
                margin-bottom: 1%;
                position: relative;
                z-index: 2;
            }

            /* ── DATE ──────────────────────────────────── */
            .date {
                font-size: clamp(16px, 4.2vmin, 46px);
                font-weight: 900;
                color: #1c1c1c;
                text-transform: uppercase;
                letter-spacing: .1em;
                margin-bottom: 2.5%;
                line-height: 1.2;
            }

            /* ── DIVIDER ───────────────────────────────── */
            .divider {
                width: clamp(28px, 5.5vmin, 56px);
                height: clamp(2px, .45vmin, 4px);
                background: #dd1f26;
                opacity: .5;
                margin-bottom: 2.5%;
                border-radius: 2px;
            }

            /* ── PROPERTY IMAGE ────────────────────────── */
            .property-img {
                width: clamp(260px, 62vmin, 760px);
                height: clamp(195px, 46.5vmin, 570px);
                border-radius: clamp(8px, 1.8vmin, 20px);
                object-fit: cover;
                border: 3px solid rgba(221,31,38,.15);
                box-shadow: 0 6px 32px rgba(0,0,0,.15);
                margin-bottom: 3%;
            }

            /* ── PROPERTY NAME ────────────────────────── */
            .property-name {
                font-size: clamp(17px, 3.8vmin, 42px);
                font-weight: 800;
                color: #1c1c1c;
                line-height: 1.3;
                margin-bottom: 2%;
            }

            /* ── PROPERTY TYPE PILL ────────────────────── */
            .property-type {
                display: inline-block;
                padding: 1.2% 3%;
                background: rgba(221,31,38,.1);
                color: #dd1f26;
                font-size: clamp(10px, 2vmin, 20px);
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: .12em;
                border-radius: 100px;
                margin-bottom: 2.5%;
                white-space: nowrap;
            }

            /* ── PRICE (HERO ELEMENT — REALLY POPS) ────── */
            .price {
                display: flex;
                align-items: baseline;
                gap: .12em;
                position: relative;
            }

            .price::before {
                content: '';
                position: absolute;
                inset: -18% -28%;
                background: rgba(221,31,38,.06);
                border-radius: 16px;
                z-index: -1;
            }

            .price-amount {
                font-size: clamp(36px, 9.5vmin, 104px);
                font-weight: 900;
                color: #dd1f26;
                letter-spacing: -.03em;
                line-height: .95;
            }

            .price-unit {
                font-size: clamp(13px, 2.6vmin, 30px);
                font-weight: 700;
                color: #dd1f26;
                opacity: .55;
                text-transform: uppercase;
                letter-spacing: .05em;
            }

            /* ── Price pop animation on slide change ───── */
            .slide[data-state="active"] .price {
                animation: pricePop .55s cubic-bezier(.34,1.56,.64,1) .15s both;
            }

            .slide[data-state="active"] .property-img {
                animation: imgIn .5s cubic-bezier(.34,1.56,.64,1) .05s both;
            }

            @keyframes pricePop {
                from {
                    transform: scale(.4);
                    opacity: 0;
                }

                to {
                    transform: scale(1);
                    opacity: 1;
                }
            }

            @keyframes imgIn {
                from {
                    transform: scale(.7);
                    opacity: 0;
                }

                to {
                    transform: scale(1);
                    opacity: 1;
                }
            }

            /* ── NAV ARROWS ────────────────────────────── */
            .nav {
                position: absolute;
                top: 50%;
                transform: translateY(-50%);
                width: clamp(38px, 7.5vmin, 76px);
                height: clamp(38px, 7.5vmin, 76px);
                border-radius: 50%;
                background: #dd1f26;
                border: none;
                outline: none;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 10;
                animation: pulse 2.4s ease-out infinite;
                transition: transform .18s ease, opacity .3s ease;
                -webkit-tap-highlight-color: transparent;
            }

            .nav:active {
                transform: translateY(-50%) scale(.88);
            }

            .nav.prev {
                left: 3%;
            }

            .nav.next {
                right: 3%;
            }

            .nav.disabled {
                opacity: .15;
                pointer-events: none;
                animation: none;
            }

            .nav svg {
                width: 42%;
                height: 42%;
                fill: white;
            }

            @keyframes pulse {
                0% {
                    box-shadow: 0 0 0 0 rgba(221,31,38,.75);
                }

                65% {
                    box-shadow: 0 0 0 clamp(10px,2.2vmin,22px) rgba(221,31,38,0);
                }

                100% {
                    box-shadow: 0 0 0 0 rgba(221,31,38,0);
                }
            }

            .nav.next {
                animation-delay: 1.2s;
            }

            /* ── PROGRESS DOTS ─────────────────────────── */
            .progress {
                position: absolute;
                bottom: 3%;
                left: 50%;
                transform: translateX(-50%);
                display: flex;
                gap: clamp(5px, .9vmin, 9px);
                flex-wrap: wrap;
                justify-content: center;
                max-width: 65%;
                z-index: 10;
            }

            .dot {
                width: clamp(5px, .9vmin, 8px);
                height: clamp(5px, .9vmin, 8px);
                border-radius: 50%;
                background: rgba(0,0,0,.18);
                cursor: pointer;
                transition: background .3s, transform .3s;
                -webkit-tap-highlight-color: transparent;
            }

            .dot.active {
                background: #dd1f26;
                transform: scale(1.45);
            }

            /* ── CORNER DECORATION ─────────────────────── */
            .corner {
                position: absolute;
                width: clamp(24px, 4.5vmin, 48px);
                height: clamp(24px, 4.5vmin, 48px);
                opacity: .28;
            }

            .corner.tl {
                top: 12%;
                left: 4%;
                border-top: 2px solid #dd1f26;
                border-left: 2px solid #dd1f26;
            }

            .corner.tr {
                top: 12%;
                right: 4%;
                border-top: 2px solid #dd1f26;
                border-right: 2px solid #dd1f26;
            }

            .corner.bl {
                bottom: 12%;
                left: 4%;
                border-bottom: 2px solid #dd1f26;
                border-left: 2px solid #dd1f26;
            }

            .corner.br {
                bottom: 12%;
                right: 4%;
                border-bottom: 2px solid #dd1f26;
                border-right: 2px solid #dd1f26;
            }

            /* ── NEWS24 LOGO ─────────────────────────── */
            .n24-logo {
                position: absolute;
                bottom: 3.5%;
                right: 4%;
                z-index: 15;
            }

            .n24-logo svg {
                height: clamp(27px, 4.5vmin, 48px);
                width: auto;
                display: block;
            }

            /* ── CREDITS ────────────────────────────── */
            .credits {
                position: absolute;
                bottom: 5%;
                left: 4%;
                font-size: clamp(8px, 1.5vmin, 16px);
                font-weight: 600;
                letter-spacing: .05em;
                color: #1c1c1c;
                line-height: 1.8;
                z-index: 10;
            }

            .credits span {
                color: #1c1c1c;
                font-weight: 700;
            }

            .credits .img-credit {
                color: #1c1c1c;
                font-weight: 600;
            }

            /* ── HOLDING NUMBER ──────────────────────── */
            .holding {
                font-size: clamp(10px, 1.8vmin, 18px);
                font-weight: 600;
                letter-spacing: .08em;
                color: rgba(0,0,0,.4);
                text-transform: uppercase;
                margin-top: 1.5%;
                margin-bottom: 2.5%;
            }

            /* ── MOBILE OPTIMIZATION ─────────────────── */
            @media (max-width: 480px) {
                .frame {
                    height: min(100vw * 1.25, 1350px) !important;
                }

                .slide {
                    padding: 8% 5% 15% 5% !important;
                }

                .property-img {
                    width: clamp(280px, 72vw, 500px) !important;
                    height: clamp(210px, 54vw, 375px) !important;
                }

                .price-amount {
                    font-size: clamp(32px, 9vw, 72px) !important;
                }

                .price-unit {
                    font-size: clamp(11px, 2.4vw, 22px) !important;
                }

                .credits {
                    font-size: clamp(7px, 1.3vw, 11px) !important;
                }
            }
        </style>
    </head>

            }];

            const container = document.getElementById('slidesContainer');
            const counterEl = document.getElementById('counter');
            const progressEl = document.getElementById('progress');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const total = events.length;
            let current = 0;

            events.forEach( (ev, i) => {
                const slide = document.createElement('div');
                slide.className = 'slide';
                slide.dataset.state = i === 0 ? 'active' : 'after';
                slide.innerHTML = `
      <div class="reg-label">Registered on</div>
      <div class="date">${ev.date}</div>
      <div class="divider"></div>
      <img class="property-img" src="${ev.img}" alt="${ev.name}">
      <div class="property-name">${ev.name}</div>
      <div class="property-type">${ev.type}</div>
      ${ev.holding ? '<div class="holding">' + ev.holding + '</div>' : ''}
      <div class="price">
        <span class="price-amount">R${ev.price}</span><span class="price-unit">million</span>
      </div>
    `;
                container.appendChild(slide);

                const dot = document.createElement('div');
                dot.className = 'dot' + (i === 0 ? ' active' : '');
                dot.addEventListener('click', () => goTo(i));
                progressEl.appendChild(dot);
            }
            );

            function updateUI() {
                counterEl.querySelector('.counter-current').textContent = String(current + 1).padStart(2, '0');
                counterEl.querySelector('.counter-total').textContent = String(total).padStart(2, '0');
                document.getElementById('counterFill').style.width = ((current + 1) / total * 100) + '%';
                document.getElementById('imgCredit').textContent = events[current].imageCredit;
                document.querySelectorAll('.dot').forEach( (d, i) => d.classList.toggle('active', i === current));
                document.querySelectorAll('.slide').forEach( (s, i) => {
                    s.dataset.state = i < current ? 'before' : i === current ? 'active' : 'after';
                }
                );
                prevBtn.classList.toggle('disabled', current === 0);
                nextBtn.classList.toggle('disabled', current === total - 1);
            }

            function navigate(dir) {
                const n = current + dir;
                if (n < 0 || n >= total)
                    return;
                current = n;
                updateUI();
            }

            function goTo(index) {
                current = index;
                updateUI();
            }

            prevBtn.addEventListener('click', () => navigate(-1));
            nextBtn.addEventListener('click', () => navigate(1));

            document.addEventListener('keydown', e => {
                if (e.key === 'ArrowLeft')
                    navigate(-1);
                if (e.key === 'ArrowRight')
                    navigate(1);
            }
            );

            let startX = 0;
            const frame = document.getElementById('frame');
            frame.addEventListener('touchstart', e => {
                startX = e.changedTouches[0].clientX;
            }
            , {
                passive: true
            });
            frame.addEventListener('touchend', e => {
                const diff = startX - e.changedTouches[0].clientX;
                if (Math.abs(diff) > 45)
                    navigate(diff > 0 ? 1 : -1);
            }
            , {
                passive: true
            });

            updateUI();
        </script>
    </body>
</html>
